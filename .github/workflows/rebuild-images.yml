name: Rebuild full-resolution homepage images
on:
  push:
    paths:
      - '.imageparts/**'
      - '.github/workflows/rebuild-images.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild images
        run: |
          cat .imageparts/communication.*.b64 | base64 -d > communication-site.jpg
          cat .imageparts/deco.*.b64 | base64 -d > deco-site.jpg
      - name: Commit full-resolution images and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .imageparts
          rm -f .github/workflows/rebuild-images.yml
          git add -A
          git commit -m "Install full-resolution homepage images"
          git push
